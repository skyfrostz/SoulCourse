name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Validate release shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes prometheus shellcheck
          bash -n deploy/*.sh scripts/*.sh
          shellcheck deploy/*.sh scripts/*.sh

      - name: Validate observability assets
        run: |
          promtool check rules deploy/observability/prometheus-alerts.yml
          jq empty deploy/observability/grafana-public-beta-dashboard.json

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Race Test
        working-directory: backend
        run: go test -race ./...

      - name: Vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Static security scan
        working-directory: backend
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.10 -severity high -confidence high ./...

  postgres-migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: soulcourse_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soulcourse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/soulcourse_ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir backend/migrations/postgres postgres "$DATABASE_URL" up

      - name: Verify migration status
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir backend/migrations/postgres postgres "$DATABASE_URL" status

      - name: Migrate SQLite fixture and verify target manifest
        working-directory: backend
        env:
          POSTGRES_INTEGRATION_URL: ${{ env.DATABASE_URL }}
        run: go test ./cmd/sqlite-to-postgres -run TestPostgresMigrationIntegration -count=1 -v

      - name: Verify PostgreSQL repository main journey
        working-directory: backend
        env:
          POSTGRES_REPOSITORY_TEST_URL: ${{ env.DATABASE_URL }}
        run: go test ./internal/repository/postgres -run 'TestForumRepositoryPostgres(MainJourney|LifecycleAndContracts)' -count=1 -v

      - name: Verify PostgreSQL admin content journey
        working-directory: backend
        env:
          POSTGRES_ADMIN_TEST_URL: ${{ env.DATABASE_URL }}
        run: go test ./internal/http/handler -run TestAdminContentPostgresJourney -count=1 -v

      - name: Verify PostgreSQL HTTP public-beta journey
        working-directory: backend
        env:
          POSTGRES_HTTP_TEST_URL: ${{ env.DATABASE_URL }}
        run: go test ./internal/http -run TestPublicBetaPostgresHTTPJourney -count=1 -v

      - name: Enforce backend coverage with PostgreSQL integration tests
        working-directory: backend
        env:
          POSTGRES_REPOSITORY_TEST_URL: ${{ env.DATABASE_URL }}
          POSTGRES_ADMIN_TEST_URL: ${{ env.DATABASE_URL }}
          POSTGRES_HTTP_TEST_URL: ${{ env.DATABASE_URL }}
        run: |
          go test ./internal/... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt
          awk '/^total:/ { value=$3; gsub("%", "", value); if (value + 0 < 70) { print "backend coverage " value "% is below 70%" > "/dev/stderr"; exit 1 } }' coverage.txt

      - name: Upload backend coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-coverage
          path: |
            backend/coverage.out
            backend/coverage.txt
          retention-days: 30

      - name: Prove Guangdong data gate rejects an empty dataset
        env:
          GUANGDONG_DATA_YEAR: 2026
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c 'TRUNCATE requirements, policies, sources, provinces RESTART IDENTITY CASCADE'
          if psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v target_year="$GUANGDONG_DATA_YEAR" \
            -f scripts/postgres/validate-guangdong-production.sql; then
            echo "Guangdong data gate unexpectedly accepted an empty dataset" >&2
            exit 1
          fi

      - name: Seed explicit CI fixture for Guangdong data gate
        env:
          GUANGDONG_DATA_YEAR: 2026
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v target_year="$GUANGDONG_DATA_YEAR" -f scripts/postgres/seed-ci-guangdong.sql

      - name: Verify production migration and Guangdong data gate logic
        env:
          APP_ENV: production
          GUANGDONG_DATA_YEAR: 2026
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
          GOOSE_BIN="$(go env GOPATH)/bin/goose" deploy/migrate-production.sh

      - name: Roll back migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir backend/migrations/postgres postgres "$DATABASE_URL" down-to 0

      - name: Reapply migrations after rollback
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir backend/migrations/postgres postgres "$DATABASE_URL" up

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI types
        working-directory: frontend
        run: pnpm openapi:check

      - name: Dependency audit
        working-directory: frontend
        run: pnpm audit --audit-level high

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: frontend
        run: pnpm test:unit

      - name: Build
        working-directory: frontend
        run: pnpm build && pnpm check:bundle-budget

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Real backend end-to-end smoke
        working-directory: frontend
        run: pnpm test:e2e:real-backend

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build -o ../tmp/soulcourse-smoke .

      - name: Start backend
        run: |
          mkdir -p tmp/data tmp/uploads
          APP_ENV=ci SQLITE_PATH=tmp/data/soulcourse.db MEDIA_UPLOAD_DIR=tmp/uploads HTTP_PORT=1309 ./tmp/soulcourse-smoke > tmp/backend.log 2>&1 &
          echo $! > tmp/backend.pid
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:1309/healthz && exit 0
            sleep 1
          done
          cat tmp/backend.log
          exit 1

      - name: Run k6 smoke
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/k6/public-beta-readiness.js
        env:
          # k6 runs in a Docker container; 127.0.0.1 is the k6 container itself.
          BASE_URL: http://172.17.0.1:1309
          K6_SMOKE: '1'

      - name: Stop backend
        if: always()
        run: |
          if [ -f tmp/backend.pid ]; then kill "$(cat tmp/backend.pid)" || true; fi
          cat tmp/backend.log || true
