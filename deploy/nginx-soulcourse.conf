# Install as /etc/nginx/conf.d/soulcourse.conf. The deployment script owns only
# the included upstream file and never rewrites this server configuration.
include /etc/nginx/soulcourse-active-upstream.conf;

limit_req_zone $binary_remote_addr zone=soulcourse_api:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name example.invalid;

    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;

    client_max_body_size 10m;

    location /api/ {
        limit_req zone=soulcourse_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://soulcourse_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://soulcourse_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name example.invalid;
    return 301 https://$host$request_uri;
}
