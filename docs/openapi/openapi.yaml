  headers:
    RequestID:
      description: Unique request identifier
      schema:
        type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: scf_session
      description: HttpOnly SameSite=Lax server-side session cookie. Unsafe methods also require X-CSRF-Token.
    adminSession:
      type: apiKey
      name: scf_admin_session
      in: cookie
      description: HttpOnly SameSite=Lax admin session cookie. Unsafe methods also require X-CSRF-Token with scf_admin_csrf.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
        nextCursor:
          type: string
        hasMore:
          type: boolean
        degraded:
          type: boolean
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    GenericObject:
      type: object
      additionalProperties: true
    GenericList:
      type: array
      items:
        type: object
        additionalProperties: true
    EnvelopeOfGenericObject:
      type: object
