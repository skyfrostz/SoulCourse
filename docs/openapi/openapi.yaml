components:
  parameters:
    NumericId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    ProfileName:
      in: path
      name: name
      required: true
      schema:
        type: string
    UploadID:
      in: path
      name: id
      required: true
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Required for unsafe methods when authenticating with the scf_session cookie. Value must match the readable scf_csrf cookie.
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    ConversationPageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
  responses:
    ErrorResponse:
      description: Error envelope
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthSessionResponse:
      description: Auth session
      headers:
        X-Request-ID:
