    AdminWorkflowInput:
      type: object
      required: [action, actionLabel, nextStatus]
      properties:
        action:
          type: string
          description: 服务端工作流动作；动作必须与内容当前状态匹配。
          enum: [submit-content-review, approve-content, send-to-review, return-content, pass-review, keep-review, reject-after-review, start-review, unpublish-content]
        actionLabel:
          type: string
          description: 兼容字段；审计标签由服务端根据 action 决定。
        nextStatus:
          type: string
          description: 兼容校验字段；目标状态由服务端根据当前状态与 action 决定。
          enum: [待审核, 已上架, 需复核, 退回修改, 下架]
        note:
          type: string
          maxLength: 1200
        priority:
          type: string
          description: 兼容字段；优先级由服务端根据目标状态决定。
        payload:
          type: object
          description: 已弃用且被服务端忽略；现有 payload 会被保留，工作流轨迹由服务端追加。
          deprecated: true
          additionalProperties: true
